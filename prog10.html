<!DOCTYPE html>
 <html>
     <head>
           <title>Fetch API - User Dashboard</title>
           </head>
            <body>
                   <h2>User Information Dashboard</h2>
                      <button onclick="loadUsers()">Load Users</button>
                         <p id="status"></p>
                            <div id="userData"></div>
                                <script>
                                     function loadUsers() { 
                                              const status = document.getElementById('status'); 
                                                    const output = document.getElementById('userData');
                                                            
                                                    status.textContent = 'Loading...';
                                                           output.innerHTML = '';
                                                                   fetch('https://jsonplaceholder.typicode.com/users')
                                                                            .then(response => { 
                                                                                          if (!response.ok) {
                                                                                                         throw new Error(`HTTP error! Status: ${response.status}`);      
                                                                                                             }
                                                                                                             return response.json();
                                                                                                             }) 
                                                                                                             .then(data => {
                                                                                                                 status.textContent = '';
                                                                                                                   const listHTML = data.map(user =>
                                                                                                                     `<li><strong>${user.name}</strong> - ${user.email} - ${user.address.city}</li>`).join('');
                                                                                                                      output.innerHTML = `<ul>${listHTML}</ul>`; 
                                                                                                                      }) 
                                                                                                                      .catch(error => { 
                                                                                                                        status.textContent = 'Failed to load data.';
                                                                                                                         status.classList.add('error');
                                                                                                                          console.error('Fetch error:', error); 
                                                                                                                          });
                                                                                                                           }
                                                                                                                            </script> 
                                                                                                                            </body>
                                                                                                                             </html>
